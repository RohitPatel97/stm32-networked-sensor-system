name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest --cov=sensor_monitor --cov-report=term-missing
      - run: sensor-monitor validate examples/telemetry.jsonl
      - run: sensor-monitor convert-freertos examples/freertos_telemetry.ndjson --device-id ci-hub --boot-id 1 --output "$RUNNER_TEMP/gateway.jsonl"
      - run: sensor-monitor validate "$RUNNER_TEMP/gateway.jsonl"

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t sensor-monitor:test .
      - run: docker run --detach --name sensor-monitor-ci --publish 127.0.0.1:8000:8000 sensor-monitor:test
      - name: Verify running production container
        run: |
          for attempt in $(seq 1 30); do
            if python3 scripts/smoke_test.py http://127.0.0.1:8000; then
              exit 0
            fi
            sleep 1
          done
          docker logs sensor-monitor-ci
          exit 1
      - name: Clean up test container
        if: always()
        run: docker rm --force sensor-monitor-ci || true
